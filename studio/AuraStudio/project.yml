name: AuraStudio
options:
  bundleIdPrefix: com.ricolinos.aurastudio
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  # Sin esto XcodeGen desempaqueta el .icon de Icon Composer (Xcode 26)
  # como si fuera una carpeta comun -- copia su icon.json y los SVG
  # internos sueltos en vez de agregarlo como un unico paquete de icono,
  # y Xcode no lo reconoce como App Icon. Ver issue #1556 de XcodeGen.
  fileTypes:
    "icon":
      file: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # Aura Studio necesita hablar directo con IOKit/DiskArbitration para
    # detectar el iPod y desmontarlo programaticamente, y ejecutar el
    # binario mks5lboot embebido -- el sandbox de la App Store restringe
    # justamente eso, asi que la app se distribuye fuera de la App Store,
    # sin sandbox (ver D-033 en DECISIONS.md y AuraInstallerView para la
    # explicacion que se le muestra al usuario sobre por que).
    ENABLE_APP_SANDBOX: NO

targets:
  AuraStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/AuraStudio
      # NOTA: el top-level "resources:" de XcodeGen no genero ninguna
      # entrada de Copy Bundle Resources en este entorno (XcodeGen
      # 2.46.0 / Xcode 26.6, objectVersion 77) -- ni para carpetas ni
      # para archivos sueltos, confirmado con un proyecto minimo de
      # prueba. La forma que si funciona es listarlos aca, bajo
      # "sources", con "buildPhase: resources" explicito (ver D-036 en
      # DECISIONS.md).
      #
      # Estos 5 archivos NO viven en este repo -- los trae
      # scripts/fetch-firmware.sh desde el Release de Aura-Firmware
      # fijado en FIRMWARE_VERSION (o desde --from-dir en desarrollo,
      # ver CONTRATO-firmware-studio.md). Corre ese script antes de
      # `xcodegen generate` o el build falla por recursos faltantes.
      - path: Vendor/firmware-dist/rockbox.ipod
        buildPhase: resources
      - path: Vendor/firmware-dist/rockbox.zip
        buildPhase: resources
      - path: Vendor/firmware-dist/bootloader-ipod6g.ipod
        buildPhase: resources
      - path: Vendor/firmware-dist/mks5lboot
        buildPhase: resources
      - path: Vendor/firmware-dist/checksums.txt
        buildPhase: resources
      # ST-047: tag del Release de Aura embebido, lo escribe
      # fetch-firmware.sh; lo lee la pantalla de Licencias (CONTRATO §B).
      - path: Vendor/firmware-dist/firmware-version.txt
        buildPhase: resources
      # ST-047: segunda familia, Metro-Aura, como REFERENCIA DE CARPETA
      # (carpeta azul): se copia entera a Resources/metro/ y sus
      # rockbox.ipod/rockbox.zip/mks5lboot/... no chocan con los de Aura
      # de arriba. BundledArtifacts la resuelve con subdirectory: "metro".
      # Tambien la puebla scripts/fetch-firmware.sh (--family metro).
      - path: Vendor/firmware-dist/metro
        type: folder
        buildPhase: resources
      # ST-065: tercera familia, moonlit.aura, misma mecanica que metro/.
      # BundledArtifacts la resuelve con subdirectory: "moonlit"; la puebla
      # scripts/fetch-firmware.sh (--family moonlit).
      - path: Vendor/firmware-dist/moonlit
        type: folder
        buildPhase: resources
      # App icon (Icon Composer, con soporte de modo oscuro y "glass"
      # nativo -- ver Resources/AppIcon.icon/icon.json). El nombre del
      # archivo sin extension tiene que matchear
      # ASSETCATALOG_COMPILER_APPICON_NAME de abajo.
      - path: Resources/AppIcon.icon
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Aura Studio
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Aura Studio"
        NSRemovableVolumesUsageDescription: >
          Aura Studio necesita acceder a volumenes removibles para
          detectar tu iPod, verificar su formato y sincronizar tu
          biblioteca con el firmware Aura.
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ricolinos.aurastudio
        INFOPLIST_KEY_NSHumanReadableCopyright: "Aura Studio"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    # ST-018: mks5lboot es un ejecutable que viaja como recurso. Copy
    # Bundle Resources conserva los permisos del origen, y el origen
    # (un asset bajado del Release, ver scripts/fetch-firmware.sh)
    # puede llegar sin bit de ejecucion -- entonces `Process.run()`
    # falla con "permission denied", el sondeo DFU nunca encuentra al
    # iPod y el instalador se queda en "Esperando modo DFU...". Esta
    # fase corre despues de copiar recursos y antes de firmar.
    postBuildScripts:
      - name: "mks5lboot: asegurar bit de ejecucion"
        basedOnDependencyAnalysis: false
        script: |
          # ST-047/ST-065: el de Aura en la raiz de Resources, el de Metro
          # en metro/ y el de moonlit en moonlit/.
          for BIN in "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mks5lboot" \
                     "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/metro/mks5lboot" \
                     "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/moonlit/mks5lboot"; do
            if [ -f "$BIN" ] && [ ! -x "$BIN" ]; then
              chmod 755 "$BIN"
              echo "mks5lboot: bit de ejecucion restaurado en el bundle ($BIN)"
            fi
          done

  AuraStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AuraStudioTests
    dependencies:
      - target: AuraStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ricolinos.aurastudio.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AuraStudio:
    build:
      targets:
        AuraStudio: all
        AuraStudioTests: [test]
    test:
      targets:
        - AuraStudioTests
    run:
      config: Debug
